<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nomi demo photos</title>
<style>
:root{--bg:#1B1B3A;--fg:#FFF4D6;--sub:#FFE7B0;--acc:#FFB627}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif}
main{display:grid;grid-template-rows:1fr auto;height:100%}
figure{margin:0;display:flex;align-items:center;justify-content:center;min-height:0;padding:16px}
img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
footer{display:flex;gap:16px;align-items:center;padding:12px 20px 18px;border-top:1px solid #ffffff22}
footer div{flex:1;min-width:0}h1{font-size:20px;margin:0 0 4px;color:var(--acc)}p{margin:2px 0;color:var(--sub)}
button{font:600 15px system-ui;background:var(--acc);color:var(--bg);border:0;border-radius:12px;padding:12px 16px;cursor:pointer}
.n{font-variant-numeric:tabular-nums;color:var(--sub);white-space:nowrap}
</style></head><body><main>
<figure><img id="img" alt=""></figure>
<footer><button id="prev" aria-label="Previous photo">‹</button>
<div><h1 id="t"></h1><p id="w"></p><p id="e"></p></div>
<span class="n" id="n"></span><button id="next" aria-label="Next photo">›</button></footer>
</main><script>
const S=[{"f": "menu/1-printed-menu.jpg", "t": "Saffron House menu", "w": "Head Chef → Dishes → Snap a new menu", "e": "Muse Wonder types up 13 dishes. The Hara Bhara Kebab price (stain) and Rasmalai (folded corner) come back amber."}, {"f": "golden-plates/tandoori-prawns.jpg", "t": "Tandoori Prawns: the Golden Plate", "w": "Kitchen staff → Check my plate → pick Tandoori Prawns", "e": "SAM 3.1 finds every part: “Ready to go”."}, {"f": "golden-plates/lamb-shank-rogan-josh.jpg", "t": "Lamb Shank Rogan Josh: the Golden Plate", "w": "Kitchen staff → Check my plate → pick Lamb Shank Rogan Josh", "e": "SAM 3.1 finds every part: “Ready to go”."}, {"f": "golden-plates/kesar-pista-kulfi.jpg", "t": "Kesar Pista Kulfi: the Golden Plate", "w": "Kitchen staff → Check my plate → pick Kesar Pista Kulfi", "e": "SAM 3.1 finds every part: “Ready to go”."}, {"f": "golden-plates/chicken-biryani.jpg", "t": "Chicken Biryani: the Golden Plate", "w": "Kitchen staff → Check my plate → pick Chicken Biryani", "e": "SAM 3.1 finds every part: “Ready to go”."}, {"f": "golden-plates/burrata-mango-chaat.jpg", "t": "Burrata Mango Chaat: the Golden Plate", "w": "Kitchen staff → Check my plate → pick Burrata Mango Chaat", "e": "SAM 3.1 finds every part: “Ready to go”."}, {"f": "golden-plates/mutton-biryani.jpg", "t": "Mutton Biryani: the Golden Plate", "w": "Kitchen staff → Check my plate → pick Mutton Biryani", "e": "SAM 3.1 finds every part: “Ready to go”."}, {"f": "off-standard/tandoori-prawns--four-prawns.jpg", "t": "Tandoori Prawns: off-standard plate", "w": "Kitchen staff → Check my plate → pick Tandoori Prawns", "e": "“Fix before it goes”: “4 prawns, reference is 5”"}, {"f": "off-standard/lamb-shank-rogan-josh--no-rice.jpg", "t": "Lamb Shank Rogan Josh: off-standard plate", "w": "Kitchen staff → Check my plate → pick Lamb Shank Rogan Josh", "e": "“Fix before it goes”: “Saffron rice missing”, with its outline drawn where it should be"}, {"f": "off-standard/kesar-pista-kulfi--no-petals.jpg", "t": "Kesar Pista Kulfi: off-standard plate", "w": "Kitchen staff → Check my plate → pick Kesar Pista Kulfi", "e": "“Fix before it goes”: “Rose petals missing”"}, {"f": "off-standard/chicken-biryani--onions-missing.jpg", "t": "Chicken Biryani: off-standard plate", "w": "Kitchen staff → Check my plate → pick Chicken Biryani", "e": "“Fix before it goes”: “Fried onions missing”"}, {"f": "off-standard/chicken-biryani--three-pieces.jpg", "t": "Chicken Biryani: off-standard plate", "w": "Kitchen staff → Check my plate → pick Chicken Biryani", "e": "“Fix before it goes”: “3 chicken pieces, reference is 4”"}, {"f": "off-standard/chicken-biryani--rice-short.jpg", "t": "Chicken Biryani: off-standard plate", "w": "Kitchen staff → Check my plate → pick Chicken Biryani", "e": "“Fix before it goes”: Rice share under the Golden Plate"}, {"f": "off-standard/paneer-tikka--chutney-missing.jpg", "t": "Paneer Tikka: off-standard plate", "w": "Kitchen staff → Check my plate → pick Paneer Tikka", "e": "“Fix before it goes”: “Mint chutney missing”"}, {"f": "off-standard/mutton-biryani--egg-missing.jpg", "t": "Mutton Biryani: off-standard plate", "w": "Kitchen staff → Check my plate → pick Mutton Biryani", "e": "“Fix before it goes”: “Boiled egg missing”"}, {"f": "guest-photos/chicken-biryani--table-7.jpg", "t": "A guest’s photo of Chicken Biryani", "w": "Guest page (Under the hood → Guest page) → Show us your plate", "e": "Muse Spark names the dish: Chicken Biryani."}, {"f": "guest-photos/tandoori-prawns--table-4.jpg", "t": "A guest’s photo of Tandoori Prawns", "w": "Guest page (Under the hood → Guest page) → Show us your plate", "e": "Muse Spark names the dish: Tandoori Prawns."}, {"f": "guest-photos/paneer-tikka--table-9.jpg", "t": "A guest’s photo of Paneer Tikka", "w": "Guest page (Under the hood → Guest page) → Show us your plate", "e": "Muse Spark names the dish: Paneer Tikka."}, {"f": "guest-photos/butter-chicken--table-2.jpg", "t": "A guest’s photo of Butter Chicken", "w": "Guest page (Under the hood → Guest page) → Show us your plate", "e": "Muse Spark names the dish: Butter Chicken."}, {"f": "kitchen/dry-store.jpg", "t": "Dry store shelf", "w": "Manager → Larder → Scan a shelf", "e": "SAM 3.1 counts sacks, cans and bags one by one."}];
let i=Math.max(0,Math.min(S.length-1,(parseInt(location.hash.slice(1))||1)-1));
const show=()=>{const s=S[i];img.src=s.f;img.alt=s.t;t.textContent=s.t;w.textContent='Open: '+s.w;e.textContent='Nomi should: '+s.e;n.textContent=(i+1)+' / '+S.length;history.replaceState(null,'','#'+(i+1))};
const go=d=>{i=(i+d+S.length)%S.length;show()};
prev.onclick=()=>go(-1);next.onclick=()=>go(1);
addEventListener('keydown',k=>{if(k.key==='ArrowRight'||k.key===' ')go(1);if(k.key==='ArrowLeft')go(-1)});
show();
</script></body></html>
